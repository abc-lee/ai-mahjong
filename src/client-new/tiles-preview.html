<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>麻将牌预览 - 大牌/小牌 × 手机/桌面</title>
<style>
  body { margin: 0; background: #222; color: #fff; font-family: sans-serif; }
  header { padding: 8px 16px; background: #111; display: flex; gap: 24px; align-items: center; position: sticky; top: 0; z-index: 10; }
  header h1 { font-size: 16px; margin: 0; }
  .panes { display: flex; gap: 12px; padding: 12px; align-items: flex-start; }
  .pane { border: 1px solid #555; border-radius: 8px; overflow: hidden; background: #1a5f3f; }
  .pane iframe { display: block; border: 0; width: 100%; height: 88vh; }
  .pane-label { text-align: center; padding: 6px; background: #333; font-size: 13px; }
  #pane-mobile { width: 390px; flex: none; }
  #pane-desktop { flex: 1; min-width: 640px; }
</style>
</head>
<body>
<header>
  <h1>麻将牌预览</h1>
  <span>左：手机视口（390px，sm: 样式不生效）</span>
  <span>右：桌面视口（≥640px，sm: 样式生效）</span>
</header>
<div class="panes">
  <div class="pane" id="pane-mobile">
    <div class="pane-label">手机 (390px)</div>
    <iframe src="tiles-preview-inner.html"></iframe>
  </div>
  <div class="pane" id="pane-desktop">
    <div class="pane-label">桌面 (≥640px)</div>
    <iframe src="tiles-preview-inner.html"></iframe>
  </div>
</div>
</body>
</html>
